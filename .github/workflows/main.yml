name: Deploy to GitHub Pages 🚀

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies 🔧
        run: npm install

      - name: Build 📥
        run: npm run build # This must output to /dist
        env:
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
          GEO_API_URL: ${{ secrets.GEO_API_URL }}
          NG_APP_API_URL: ${{ secrets.NG_APP_API_URL }}

      - name: Copy 404 page 🔧
        run: cp dist/learn-and-code/browser/404/index.html dist/learn-and-code/browser/404.html

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/learn-and-code/browser' # Directly point to your default dist folder

      - name: Deploy to GitHub Pages 🚀
        uses: actions/deploy-pages@v4
