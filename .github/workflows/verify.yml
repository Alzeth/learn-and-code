name: Verify 🧐

on:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies 🔧
        run: npm install

      - name: Lint 🔍
        run: npm run lint

      - name: Verify 🧐
        run: npm run test
