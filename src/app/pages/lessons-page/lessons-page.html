<div class="container-fluid page-container">
  <h1 class="scroll-m-20 text-center text-4xl font-extrabold tracking-tight text-balance">{{ 'pages.lessons.title' | transloco }}</h1>
  <div class="container">
    <div class="bg-background py-10">
      <div class="mx-auto max-w-7xl px-6 lg:px-8">
        @if (lessons()) {
          <div class="mx-auto max-w-2xl lg:mx-0">
            <p class="mt-2 text-lg/8">{{ 'pages.lessons.subtitle' | transloco }}</p>
          </div>
          <app-lessons-list [lessons]="lessons()" [completedIds]="completedIds()" />
        } @else {
          <app-lessons-empty />
        }
      </div>
    </div>
  </div>
</div>
