<div class="container">
  <h1 class="scroll-m-20 text-center text-4xl font-extrabold tracking-tight text-balance">Lessons page</h1>
  <div class="bg-background py-10">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
      <div class="mx-auto max-w-2xl lg:mx-0">
        <p class="mt-2 text-lg/8">Learn how to grow in python topics quickly.</p>
      </div>
      <ul class="mx-auto mt-10 grid max-w-2xl grid-cols-1 gap-x-8 gap-y-16 border-t border-gray-700 pt-10 sm:mt-16 sm:pt-16 lg:mx-0 lg:max-w-none lg:grid-cols-3">
        @for (course of courses; track course.id) {
          <li class="h-full">
            <pre>{{ course.title }}</pre>
            <pre>{{ course.description }}</pre>
          </li>
        } @empty {
          <li>There are no items.</li>
        }
      </ul>
    </div>
  </div>
</div>
