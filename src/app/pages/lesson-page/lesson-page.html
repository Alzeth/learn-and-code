<div class="container-fluid lesson-container">
  <div class="block md:flex w-full">
    <div #theoryPanel class="h-svh w-full md:w-[50%] overflow-y-auto py-[84px] px-[15px]">
      @if (isCompleted()) {
        <z-badge zType="secondary" zShape="pill" class="bg-green-800 text-white dark:bg-green-600">
          <ng-icon name="lucideBadgeCheck" />
          Completed
        </z-badge>
      }
      @if (theory()) {
        <app-markdown-parcer [theory]="theory()"></app-markdown-parcer>
      } @else if (lesson()?.theoryMd) {
        <app-markdown-parcer [theory]="lesson()?.theoryMd"></app-markdown-parcer>
      } @else {
        <app-markdown-empty></app-markdown-empty>
      }

      <nav class="flex justify-between items-center mt-8 pb-4">
        @if (prevLesson()) {
          <a [routerLink]="['/lessons', prevLesson()]" [queryParams]="{ course: courseId() }" class="text-sm text-indigo-400 hover:text-indigo-300">&larr; Previous</a>
        } @else {
          <span></span>
        }
        @if (!isCompleted()) {
          <button
            (click)="markComplete()"
            [disabled]="isMarkingComplete()"
            class="text-sm px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            {{ isMarkingComplete() ? 'Saving...' : 'Mark as Complete' }}
          </button>
        }
        @if (nextLesson()) {
          <a [routerLink]="['/lessons', nextLesson()]" [queryParams]="{ course: courseId() }" class="text-sm text-indigo-400 hover:text-indigo-300">Next &rarr;</a>
        } @else {
          <span></span>
        }
      </nav>
    </div>
    <div class="h-svh w-full md:w-[50%] py-[84px] px-[15px]">
      <app-code-editor [starterCode]="'# Write your Python code here\n'" />
    </div>
  </div>
</div>
