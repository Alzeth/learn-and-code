<div class="container-fluid lesson-container">
  <div class="block md:flex w-full">
    <div class="h-svh w-full md:w-[50%] overflow-y-auto py-[84px] px-[15px]">
      @if (theory()) {
        <app-markdown-parcer [theory]="theory()"></app-markdown-parcer>
      } @else if (lesson()?.theoryMd) {
        <app-markdown-parcer [theory]="lesson()?.theoryMd"></app-markdown-parcer>
      } @else {
        <app-markdown-empty></app-markdown-empty>
      }
    </div>
    <div class="h-svh w-full md:w-[50%] py-[84px] px-[15px]">
      <app-code-editor [starterCode]="'# Write your Python code here\n'" />
    </div>
  </div>
</div>
