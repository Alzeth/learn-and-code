<div class="rounded-2xl border border-gray-200 bg-white p-5 lg:p-6 dark:border-gray-800 dark:bg-white/3 mb-2">
  <div class="flex flex-col gap-5 sm:flex-row xl:gap-10">
    <div class="flex-1">
      <div class="mb-6 flex flex-col gap-5 sm:flex-row xl:items-center xl:justify-between">
        <div class="flex w-full flex-col items-start gap-6 sm:flex-row sm:items-center">
          <div class="border-gray-20 overflow-hidden rounded-full border dark:border-gray-800">
            <z-avatar [zSrc]="LOGO_NO_TEXT_PATH_PRD" zFallback="U" zSize="sm" />
          </div>
          <div class="text-left">
            <h4 class="mb-2 text-lg font-semibold text-gray-800 dark:text-white/90">
              Name Surname
            </h4>
            <div class="flex items-center gap-1 sm:gap-3">
              <p class="text-sm text-gray-500 dark:text-gray-400">
                Occupation
              </p>
              <div class="hidden h-3.5 w-px bg-gray-300 sm:block dark:bg-gray-700"></div>
              <p class="text-sm text-gray-500 dark:text-gray-400">
                Address
              </p>
            </div>
          </div>
        </div>
      </div>
      <div class="relative grid max-w-4xl grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4 xl:gap-x-11 xl:gap-y-7">
        <div>
          <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">
            Email address
          </p>
          <p class="text-sm font-medium text-gray-800 dark:text-white/90">
            {{ user()?.email }}
          </p>
        </div>
        <div>
          <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">
            User ID
          </p>
          <p class="text-sm font-medium text-gray-800 dark:text-white/90">
            {{ user()?.id }}
          </p>
        </div>
        <div>
          <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">
            Bio
          </p>
          <p class="text-sm font-medium text-gray-800 dark:text-white/90">
            Bio
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
