<div
  class="rounded-2xl border border-gray-200 bg-white p-5 lg:p-6 dark:border-gray-800 dark:bg-white/3"
>
  <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-5">Learning Progress</h3>
  <div class="flex gap-2.5">
    <div class="min-h-20 rounded-2xl border border-gray-200 p-4">
      <h4 class="flex mb-6 text-lg font-semibold text-gray-800 dark:text-white/90">
        <ng-icon name="lucideBookSearch" />
        Courses
      </h4>
      <div>
        <span class="inline-block mb-2"
          >{{ completedCourses() }}/{{ totalCourses() }} completed</span
        >
        <z-progress-bar
          [progress]="(completedCourses() / totalCourses()) * 100"
          zSize="lg"
          zType="accent"
        />
      </div>
    </div>
    <div class="min-h-20 rounded-2xl border border-gray-200 p-4">
      <h4 class="flex mb-6 text-lg font-semibold text-gray-800 dark:text-white/90">
        <ng-icon name="lucideScrollText" />
        Lessons
      </h4>
      <div>
        <span class="inline-block mb-2">{{ completedLessons() }} completed</span>
      </div>
    </div>
  </div>
</div>
