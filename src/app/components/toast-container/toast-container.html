<div class="toast-container" [style.--toast-duration]="toastDuration">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast-wrapper" [class.dismissing]="toast.dismissing">
      <z-alert
        [zType]="toast.type"
        [zTitle]="toast.title"
        [zDescription]="toast.message"
        [zIcon]="toast.icon ?? ''"
      />
      <div class="toast-progress"></div>
    </div>
  }
</div>
