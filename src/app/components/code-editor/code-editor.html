<div class="w-full max-w-full overflow-hidden">
  <div class="flex items-center justify-between mb-2">
    <span class="text-sm text-muted-foreground font-medium">{{
      'codeEditor.title' | transloco
    }}</span>
    <div class="flex items-center gap-2">
      <button z-button zType="outline" zSize="sm" [zTooltip]="'codeEditor.resetTooltip' | transloco" (click)="resetCode()" [zDisabled]="isRunning()">
        {{ 'codeEditor.reset' | transloco }}
        <ng-icon name="lucideRotateCcw" />
      </button>
      <button
        z-button
        zType="default"
        zSize="sm"
        [zTooltip]="'codeEditor.runTooltip' | transloco"
        (click)="runCode()"
        [zLoading]="isRunning() || pyodide.isLoading()"
        [zDisabled]="!pyodide.isReady() || isRunning()"
      >
        {{ (pyodide.isLoading() ? 'codeEditor.loadingPython' : 'codeEditor.run') | transloco }}
        @if (!pyodide.isLoading()) {
          <ng-icon name="lucidePlay" />
        }
      </button>
    </div>
  </div>

  <div class="flex-1 h-[60dvh] rounded-md overflow-hidden border border-border mb-2">
    <ngx-monaco-editor
      class="w-full h-full!"
      [options]="options"
      [(ngModel)]="code"
      (onInit)="onInit($event)"
    />
  </div>

  @if (output()) {
    <div
      class="h-[25dvh] rounded-md border p-3 font-mono text-sm leading-relaxed overflow-y-auto"
      [class]="
        hasError()
          ? 'border-destructive/40 bg-destructive/5 text-destructive'
          : 'border-border bg-muted text-foreground'
      "
    >
      <p class="text-xs font-sans font-medium mb-1 opacity-60">
        {{ (hasError() ? 'codeEditor.error' : 'codeEditor.output') | transloco }}
      </p>
      <pre class="whitespace-pre-wrap break-words">{{ output() }}</pre>
    </div>
  }

  @if (!pyodide.isReady() && !pyodide.isLoading()) {
    <p class="text-xs text-muted-foreground text-center">
      {{ 'codeEditor.runtimeNotReady' | transloco }}
    </p>
  }
</div>
