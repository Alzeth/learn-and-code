<div class="editor-container w-full max-w-full overflow-hidden">

  <div class="flex items-center justify-between">
    <span class="text-sm text-muted-foreground font-medium">Python editor</span>
    <div class="flex items-center gap-2">
      <button z-button
              zType="outline"
              zSize="sm"
              (click)="resetCode()"
              [zDisabled]="isRunning()">
        Reset
      </button>
      <button z-button
              zType="default"
              zSize="sm"
              (click)="runCode()"
              [zLoading]="isRunning() || pyodide.isLoading()"
              [zDisabled]="!pyodide.isReady() || isRunning()">
        {{ pyodide.isLoading() ? 'Loading Python...' : 'Run ▶' }}
      </button>
    </div>
  </div>

  <div class="flex-1 h-[60dvh] rounded-md overflow-hidden border border-border">
    <ngx-monaco-editor
      class="w-full h-full"
      [options]="options"
      [(ngModel)]="code"
      (onInit)="onInit($event)" />
  </div>

  @if (output()) {
    <div class="rounded-md border p-3 font-mono text-sm leading-relaxed"
         [class]="hasError()
        ? 'border-destructive/40 bg-destructive/5 text-destructive'
        : 'border-border bg-muted text-foreground'">
      <p class="text-xs font-sans font-medium mb-1 opacity-60">
        {{ hasError() ? 'Error' : 'Output' }}
      </p>
      <pre class="whitespace-pre-wrap break-words">{{ output() }}</pre>
    </div>
  }

  @if (!pyodide.isReady() && !pyodide.isLoading()) {
    <p class="text-xs text-muted-foreground text-center">
      Python runtime will load when the editor is ready.
    </p>
  }

</div>
