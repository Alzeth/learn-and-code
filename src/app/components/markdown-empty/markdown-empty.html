<z-empty
  zIcon="lucideFolderCode"
  [zTitle]="'markdownEmpty.title' | transloco"
  [zDescription]="'markdownEmpty.description' | transloco"
>
  <a class="relative block" routerLink="/lessons">
    <button type="button" z-button zType="link" zSize="sm" class="text-muted-foreground">
      {{ 'markdownEmpty.checkLessons' | transloco }}
      <ng-icon name="lucideArrowUpRight" class="size-3!" />
    </button>
  </a>
</z-empty>
