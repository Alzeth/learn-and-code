<z-empty
  zIcon="lucideFolderCode"
  [zTitle]="'course.empty.title' | transloco"
  [zDescription]="'course.empty.description' | transloco"
>
  <a class="relative block" routerLink="/courses">
    <button type="button" z-button zType="link" zSize="sm" class="text-muted-foreground">
      {{ 'course.empty.tryOther' | transloco }}
      <ng-icon name="lucideArrowUpRight" class="size-3!" />
    </button>
  </a>
</z-empty>
